<!-- 5. EVERY BLOG POST: BlogPosting template. Fill the {{ }} values from the CMS. Today every post sends datePublished = dateModified = 2026-08-20T10:37:56; dateModified must be the real last-edit time. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{post H1, max 110 chars}}",
  "description": "{{meta description}}",
  "image": "{{absolute URL of hero image}}",
  "datePublished": "{{first publish date, ISO 8601, e.g. 2026-08-20T10:37:56-05:00}}",
  "dateModified": "{{real last edit date; must change when the post is edited}}",
  "author": {
    "@type": "Person",
    "name": "{{real author name}}",
    "url": "https://innrly.com/about"
  },
  "publisher": {
    "@id": "https://innrly.com/#organization"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{absolute post URL}}"
  }
}
</script>
